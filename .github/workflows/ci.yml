name: CI

# Everything here runs the same commands a person runs on their own machine.
# There is no CI-only configuration and no CI-only script: if a step works here
# and not locally, that is the bug worth fixing.
#
# `npm test` is the whole of it. It validates the records, runs every generator,
# builds the PDF, drives a browser at 390 px, and then hands HEAD to the
# acceptance gate, which repeats the load-bearing layers inside a detached
# worktree. The gate's remaining layer, "print: contents", is a judgement about
# the printed page that no command makes, and it is not attempted here.

on:
  # Every branch, not main only. A feature branch that is pushed and runs
  # nothing has proved nothing about itself, and the first green run would then
  # happen after it reached main - which is the order this workflow exists to
  # avoid. pull_request stays for forks and for review by diff; a same-repo pull
  # request runs both events, which is a duplicate run and cheaper than a
  # branch that was never tested.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: tests and the acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out, with history
        uses: actions/checkout@v4
        with:
          # The gate's commit-hygiene layer reads the log, and the print layer
          # records the commit it built. A shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Pinned, and checked after installing. The prepress build is byte-stable
      # on one Typst version and font environment; a different version may
      # print the same deck with different page boxes, so "some typst" is not
      # the dependency this repository means.
      - name: Install Typst 0.15.1
        run: |
          set -euo pipefail
          url=https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL "$url" -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version | grep -q '^typst 0\.15\.1' || { echo "expected Typst 0.15.1, got: $(typst --version)"; exit 1; }

      # The runner image ships Chrome, but check:web looks for it by name and
      # skips with exit 2 when it cannot find it. Setting CHROME_PATH turns that
      # skip into a failure to install, which is the honest outcome here: a CI
      # run that silently skipped its only browser test would be reporting on
      # nothing.
      - name: Pin Chrome for check:web
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium; do
            if path=$(command -v "$candidate"); then
              echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
              echo "CHROME_PATH=$path"
              exit 0
            fi
          done
          echo "No Chrome or Chromium found on this runner" >&2
          exit 1

      - run: npm ci

      # The suite's output is captured as well as printed. A failed run's log
      # needs repository admin to download, and a public job page carries no
      # output at all, so without this a red run says only "process exited 1".
      # The step summary below is readable by anyone who can see the run.
      - name: Tests and gate
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Publish the failing output
        if: failure()
        run: |
          {
            echo '### Tests and gate failed'
            echo
            echo '```'
            if [ -s "$RUNNER_TEMP/tests.log" ]; then
              tail -c 50000 "$RUNNER_TEMP/tests.log"
            else
              echo 'no output was captured before the step failed'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The step summary needs a signed-in session; annotations do not, so
          # the tail of the failure is also emitted as error annotations, which
          # the checks API serves to anyone who can see the repository.
          node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP + "/tests.log";
            let text = "";
            try { text = fs.readFileSync(path, "utf8"); } catch {}
            const escape = (v) => v.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            // The layer verdicts first, so the shape of the failure is readable
            // even if the chunked tail below is cut off.
            const verdicts = text.split("\n").filter((line) => /^(PASS|FAIL|NOT RUN)\s/.test(line) || /passed, \d+ failed/.test(line));
            if (verdicts.length > 0) {
              console.log(`::error title=${escape("gate verdicts")}::${escape(verdicts.join("\n"))}`);
            }
            // GitHub truncates an annotation message at 4096 characters, so the
            // chunks are smaller than that on purpose.
            text = text.slice(-34000);
            for (let i = 0, at = 0; at < text.length && i < 9; i += 1, at += 3600) {
              console.log(`::error title=${escape(`Tests and gate ${i + 1}`)}::${escape(text.slice(at, at + 3600))}`);
            }
          '

  # One job per deck, named after its slug. The job above proves the repository
  # as a whole; this one proves that each deck stands alone: its own records
  # validate, its own artifacts generate, its own viewer works at 390 px and its
  # own PDF has the right page boxes. When the repository gains a deck, this
  # matrix reads it from decks/ rather than needing an edit here, and a failure
  # names the deck in the job list.
  decks:
    name: list decks
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          slugs=$(for f in decks/*/deck.json; do basename "$(dirname "$f")"; done \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "$slugs"

  deck:
    name: deck ${{ matrix.slug }}
    needs: decks
    if: needs.decks.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.decks.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Typst 0.15.1
        run: |
          set -euo pipefail
          url=https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL "$url" -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version | grep -q '^typst 0\.15\.1' || { echo "expected Typst 0.15.1, got: $(typst --version)"; exit 1; }

      - name: Pin Chrome for check:web
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium; do
            if path=$(command -v "$candidate"); then
              echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
              echo "CHROME_PATH=$path"
              exit 0
            fi
          done
          echo "No Chrome or Chromium found on this runner" >&2
          exit 1

      - run: npm ci

      - name: Validate
        run: npm run validate -- --deck ${{ matrix.slug }}

      - name: Generate web bundle, rules and PDF
        run: |
          npm run build:web -- --deck ${{ matrix.slug }}
          npm run build:rules -- --deck ${{ matrix.slug }}
          npm run build:pdf -- --deck ${{ matrix.slug }}

      - name: Check the viewer at 390 px
        run: npm run check:web -- --deck ${{ matrix.slug }}

      - name: Check the PDF page boxes
        run: npm run check:pdf -- --deck ${{ matrix.slug }}
